name: Nepal In Brief autopost

on:
  schedule:
    - cron: "7,37 * * * *"     # every 30 min at :07 and :37 UTC (avoids GitHub's busy :00/:30). Keep the repo PUBLIC.
  workflow_dispatch:            # "Run workflow" button for manual runs
    inputs:
      dry_run:
        description: "Dry run (render + print, no posting)"
        type: boolean
        default: false

concurrency:
  group: autopost               # never run two at once (prevents double posts)
  cancel-in-progress: false

permissions:
  contents: write               # to commit state.json back

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          GROQ_API_KEY:  ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID:    ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID:    ${{ secrets.IG_USER_ID }}
          DRY_RUN:       ${{ inputs.dry_run && '1' || '0' }}
        run: python bot.py

      - name: Upload rendered images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered
          path: out/*.jpg
          if-no-files-found: ignore
          retention-days: 3

      - name: Save state
        if: always()
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "state: $(date -u +%FT%TZ)"
          git push
